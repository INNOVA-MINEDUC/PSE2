server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 45m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API y archivos subidos: mismo dominio, sin CORS
    location /api/ {
        proxy_pass http://pse-backend:3000;
        # $http_host conserva el puerto (ej. IP:8089): el backend compara Origin contra Host
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://pse-backend:3000;
        expires 30d;
    }

    # Recursos estáticos del sitio
    location ~* \.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?|pdf|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Rutas de Vue Router
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
